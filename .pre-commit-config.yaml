# Gates, all mandatory. A private repo on a free account gets no secret scanning from GitHub,
# so local pre-commit is the only such control here. Install once per clone:
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
# BOTH flags: plain `pre-commit install` leaves the commit-msg gate inert.
#
# Three gates are consumed from the template as a hook repository, pinned by `rev`, instead of
# a copied script (agentic-dev-template decision 2026-09-23-005). The template is public since
# decision 2026-09-25-001, so the pin is a plain https URL: it needs no credential, works from
# ~/.cache/pre-commit where no per-directory git config reaches, and works in a GitHub Actions
# job (.github/workflows/gates.yml). The two content gates judge docs/personas/ and
# docs/orchestration/knowledge/.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [pre-commit]    # upstream declares none; without this it runs at every stage

  - repo: https://github.com/SaltyBrett/agentic-dev-template
    rev: v1.0.0    # the template's first public release (its decision 2026-09-25-004)
    hooks:
      - id: persona-lint
      - id: kb-frontmatter-scan
      - id: commit-attribution
