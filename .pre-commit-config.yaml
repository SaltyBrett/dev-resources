# Two gates, both mandatory. A private repo on a free account gets no secret scanning
# from GitHub, so these are the only such controls here. Install once per clone:
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
# BOTH flags: plain `pre-commit install` leaves the commit-msg gate inert.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [pre-commit]    # upstream declares none; without this it runs at every stage

  - repo: local
    hooks:
      - id: commit-attribution
        name: Commit Attribution Gate (no AI attribution in commit messages)
        entry: python scripts/commit_attribution_scan.py
        language: python        # pre-commit provisions the interpreter; macOS has no bare `python`
        stages: [commit-msg]
        pass_filenames: true
        always_run: true
