# Gates, all mandatory. A private repo on a free account gets no secret scanning from GitHub,
# so local pre-commit is the only such control here. Install once per clone:
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
# BOTH flags: plain `pre-commit install` leaves the commit-msg gate inert.
#
# Three gates are consumed from the template as a hook repository, pinned by `rev`, instead of
# a copied script (agentic-dev-template decision 2026-09-23-005). The template is private, and
# pre-commit clones it into ~/.cache/pre-commit, outside the ~/code/personal includeIf that
# rewrites plain ssh URLs to the personal identity; so the URL names the ssh host alias the
# Mac environment runbook sets up, and https (no keychain credential) is not used. The two
# content gates are Skipped until this repository holds docs/personas/ and
# docs/orchestration/knowledge/.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [pre-commit]    # upstream declares none; without this it runs at every stage

  - repo: git@github.com-personal:SaltyBrett/agentic-dev-template.git
    rev: v7.0.0
    hooks:
      - id: persona-lint
      - id: kb-frontmatter-scan
      - id: commit-attribution
